name: Compile browser REBOUND engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream Emscripten toolchain
        run: |
          git clone --depth 1 --branch 4.0.10 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 4.0.10
          /tmp/emsdk/emsdk activate 4.0.10
      - name: Compile the pinned physics source
        shell: bash
        run: |
          source /tmp/emsdk/emsdk_env.sh
          ./engine/build_wasm.sh
      - name: Retain distributable and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: browser-physics-build
          path: static/engine/
      - name: Public generated-code transport
        run: |
          python3 - <<'PY'
          import base64,json,pathlib
          for p in sorted(pathlib.Path('static/engine').glob('*')):
              if p.suffix=='.gz':continue
              data=base64.b64encode(p.read_bytes()).decode()
              chunks=[data[i:i+12000] for i in range(0,len(data),12000)]
              for i,chunk in enumerate(chunks):
                  print('PHYSICS_BUILD_CHUNK '+json.dumps({'name':p.name,'index':i,'count':len(chunks),'data':chunk}),flush=True)
