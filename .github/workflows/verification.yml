name: Physics and browser verification
on:
  push:
    branches: [main, "foundation/**", "feat/issue-3-recoverable-sessions"]
  pull_request:
    branches: [main, "foundation/rebound-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics:
    name: REBOUND solar system physics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_rebound.py tests/test_sessions.py -v

  browser:
    name: Chromium browser interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py -v
      - name: Keep graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
