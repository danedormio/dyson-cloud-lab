name: Final cloud interaction acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Verify the actual final interface
        env:
          EXPECTED_BUILD: 0ad5d5374b5805f7c347e0d7beb87219403af45a
        run: |
          python -u - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          from types import SimpleNamespace
          from playwright.sync_api import sync_playwright
          sys.path.insert(0,'tests')
          from test_minimal_browser import test_minimal_launch_controls_motion_and_mobile, test_3d_aim_orbit_inspection_recovery_and_mobile_launch, test_reset_clears_legacy_arrival_notice
          base='https://dyson-cloud-lab-rebound-staging.onrender.com'
          with urllib.request.urlopen(base+'/health',timeout=120) as response:health=json.load(response)
          assert health['revision']==os.environ['EXPECTED_BUILD'],health
          print('Exact hosted build:',health['revision'],flush=True)
          Path('test-artifacts').mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for case in [test_minimal_launch_controls_motion_and_mobile,test_3d_aim_orbit_inspection_recovery_and_mobile_launch,test_reset_clears_legacy_arrival_notice]:
                  case(SimpleNamespace(url=base),browser)
                  print('FINAL HOSTED CASE PASSED:',case.__name__,flush=True)
              page=browser.new_page(viewport={'width':1440,'height':960});errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(base+'/simple',timeout=120000);page.wait_for_function('!!cloudView?.world')
              assert page.locator('#play').inner_text()=='Play'
              page.click('#launch');page.wait_for_function('!!cloudView.world.packet')
              page.click('#packetinfo');home=page.locator('#home').bounding_box();panel=page.locator('#inspector').bounding_box()
              assert home['y']+home['height']<=panel['y'],(home,panel)
              page.click('#home');page.screenshot(path='test-artifacts/final-cloud-desktop.png')
              page.set_viewport_size({'width':390,'height':900});page.screenshot(path='test-artifacts/final-cloud-mobile.png',full_page=True)
              assert not errors,errors
              Path('test-artifacts/final-layout-observations.json').write_text(json.dumps({'health':health,'home':home,'inspector':panel,'page_errors':errors}))
              print('FINAL HOSTED LAYOUT PASSED',flush=True)
              browser.close()
          PY
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-cloud-interaction-evidence
          path: test-artifacts/
          if-no-files-found: error
