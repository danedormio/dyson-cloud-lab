name: Hosted complete cloud baseline acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual merged development revision and complete 900-body journey
        env:
          DYSON_LIVE_SHA: a975016d064a6c6eaf36cf45729f118653706c63
        run: python -m pytest tests/test_live_cloud_lab.py -vs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-cloud-hosted-evidence
          path: test-artifacts/
          if-no-files-found: error
